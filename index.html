    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
            background:#0d1117;

        .card{

            padding:16px 34px;

            color:white;
            text-decoration:none;
            border-radius:12px;
            font-weight:600;
            transition:.25s;
        }

        .button:hover{
            background:#2ea043;
            transform:translateY(-2px);

        .footer{
